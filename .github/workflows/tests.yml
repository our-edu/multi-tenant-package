name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    name: Code Style (PSR-12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: php-cs-fixer

      - name: Check code style
        run: php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.php

  test:
    name: PHP ${{ matrix.php-version }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    needs: code-style

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            coverage: false
          - php-version: '8.3'
            laravel: '10.*'
            testbench: '8.*'
            coverage: false
          - php-version: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            coverage: false
          - php-version: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            coverage: false
          - php-version: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            coverage: true
          - php-version: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            coverage: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, json, pdo_sqlite, sqlite3
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}

      - name: Check the PHP timezone database knows Egypt DST
        # The package ships tenant:check-tzdata for the same reason; a runner with a
        # stale tz table would make the timezone tests fail for the wrong reason.
        run: |
          php -r '$o = (new DateTime("2026-07-01 12:00", new DateTimeZone("Africa/Cairo")))->format("P"); echo "tzdb=", timezone_version_get(), " Cairo(Jul)=", $o, PHP_EOL; exit($o === "+03:00" ? 0 : 1);'

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-laravel${{ matrix.laravel }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-laravel${{ matrix.laravel }}-composer-

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false

          composer require \
            --no-update \
            --no-interaction \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}"

          composer require \
            --dev \
            --no-update \
            --no-interaction \
            "orchestra/testbench:${{ matrix.testbench }}"

          composer update \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --with-all-dependencies

      - name: Show resolved versions
        run: composer show laravel/framework orchestra/testbench nesbot/carbon phpunit/phpunit | grep -E '^(name|versions)'

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: composer test

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: composer test:coverage

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/clover.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
